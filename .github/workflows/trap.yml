name: Trap watch (morning)

on:
  schedule:
    - cron: "15 5 * * 1-5"   # 10:45 IST, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Build morning trap status
        run: |
          python scripts/fetch_prices.py
          python scripts/intraday_engine.py
          python scripts/traps.py
      - name: Send trap alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python scripts/trap_alert.py
        continue-on-error: true
      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "trap watch $(date -u +%Y-%m-%d-%H%M)"
          git pull --rebase origin main || true
          git push
